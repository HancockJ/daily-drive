<!-- Concept 1: app-icon mark. A football driving forward across yard lines, lime motion trail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0b1017"/>
  <!-- yard lines -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="6">
    <line x1="96" y1="96" x2="96" y2="416"/><line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/><line x1="336" y1="96" x2="336" y2="416"/><line x1="416" y1="96" x2="416" y2="416"/>
  </g>
  <!-- motion trail -->
  <g stroke="#c7f36b" stroke-linecap="round">
    <line x1="88" y1="214" x2="168" y2="214" stroke-width="18" stroke-opacity="0.45"/>
    <line x1="60" y1="256" x2="168" y2="256" stroke-width="22"/>
    <line x1="88" y1="298" x2="168" y2="298" stroke-width="18" stroke-opacity="0.45"/>
  </g>
  <!-- ball -->
  <g transform="translate(316 256)">
    <path d="M-128 0 C -80 -92, 80 -92, 128 0 C 80 92, -80 92, -128 0 Z" fill="#c7f36b"/>
    <path d="M-128 0 C -80 -92, 80 -92, 128 0 C 80 92, -80 92, -128 0 Z" fill="none" stroke="#0b1017" stroke-width="10"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#0b1017" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#0b1017" stroke-width="10" stroke-linecap="round">
      <line x1="-28" y1="-16" x2="-28" y2="16"/><line x1="0" y1="-16" x2="0" y2="16"/><line x1="28" y1="-16" x2="28" y2="16"/>
    </g>
  </g>
</svg>
